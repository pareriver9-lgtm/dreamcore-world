

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shelf</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Georgia, serif;
            min-height: 100vh;
            text-align: center;
            box-shadow: inset 0 0 60px 15px rgba(145, 70, 255, 0.45);
        }

        h1 {
            padding-top: 70px;
            font-weight: normal;
            letter-spacing: 8px;
            font-size: 25px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
        }

        .shelf {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 35px;
            margin: 180px auto 0;
            padding: 20px;
            border-bottom: 5px solid #555;
            width: 75%;
            max-width: 750px;
        }

        .item {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 35px;
            transition: 0.3s;
        }

        .item:hover {
            transform: translateY(-12px);
            filter: brightness(1.8);
        }

        .item p {
            font-size: 11px;
            color: #888;
            letter-spacing: 2px;
        }

        #description {
            margin: 60px auto;
            color: #aaa;
            min-height: 30px;
        }
    </style>
</head>

<body>

    <h1>THE SHELF</h1>
    <p class="subtitle">Some things were left here. They're covered in dust.</p>

    <div class="shelf">

        <button class="item" onclick="showItem('The clouds are moving, but the jar is sealed.')">
            🫙
            <p>JAR OF CLOUDS</p>
        </button>

        <button class="item" onclick="showItem('It shines even though there is no light.')">
            ⭐
            <p>STAR</p>
        </button>

        <button class="item" onclick="clickEye()">
            👁️
            <p>THE EYE</p>
        </button>

    </div>

    <p id="description">Choose something.</p>

    <script>
        let eyeClicks = 0;

        function showItem(message) {
            document.getElementById("description").textContent = message;
        }

        function clickEye() {
            eyeClicks++;

            const description = document.getElementById("description");
if (eyeClicks >= 10) {
    description.textContent = "You've been staring for too long.";

    document.body.style.boxShadow =
        "inset 0 0 100px 40px rgba(255, 0, 0, 0.9)";

    document.body.style.backgroundColor = "#180000";

    setTimeout(() => {
        window.location.href = "../index.html";
    }, 2500);

    return;
}            const messages = [
                "It blinks when you aren't looking.",
                "Why are you looking at me?",
                "I can see you.",
                "Please stop.",
                "You're still here."
            ];

            description.textContent =
                messages[Math.floor(Math.random() * messages.length)];
        }
    </script>

</body>
</html>
